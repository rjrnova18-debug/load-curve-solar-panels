<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title">Load Curve &amp; Solar Sizing</title>
    <meta
      name="description"
      content="Estimate how much energy a home, business or building uses hour by hour, and size the solar system that could supply it."
    />
    <script>
      // Apply a saved theme before the first paint so the page never flashes the wrong one.
      try {
        const theme = localStorage.getItem("loadcurve.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Federo&display=swap"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/sky.css" />
    <link rel="stylesheet" href="/css/loads.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8b21c'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232e7466' stroke-width='3' stroke-dasharray='4 3'/%3E%3C/svg%3E"
    />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <g fill="var(--verdigris)">
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(45 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(90 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(135 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(180 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(225 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(270 16 16)" />
              <ellipse cx="16" cy="4.5" rx="2.4" ry="4.5" transform="rotate(315 16 16)" />
            </g>
            <circle cx="16" cy="16" r="6.5" fill="var(--sun)" />
          </svg>
          <span data-i18n="app.title">Load Curve &amp; Solar Sizing</span>
        </div>
        <div class="header-tools">
          <div class="segmented" role="group" data-i18n-attr="aria-label: header.language">
            <button type="button" data-language="en" aria-pressed="true">EN</button>
            <button type="button" data-language="es" aria-pressed="false">ES</button>
          </div>
          <button type="button" class="icon-button" data-theme-toggle>
            <svg class="theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path
                d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <h1 id="hero-title" data-i18n="hero.title">How much energy does your place use, and when?</h1>
        <p class="hero__summary" data-hero-summary aria-live="polite">
          Add your loads and this skyline takes the shape of your day.
        </p>
      </div>
      <div class="sky-frame" data-sky></div>
      <div class="sky-hours" aria-hidden="true">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span
        ><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span
        ><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span
        ><span>21</span><span>22</span><span>23</span>
      </div>
    </section>

    <main class="steps wrap">
      <section class="step" id="loads" aria-labelledby="loads-title">
        <div class="step__marker"><span class="step__number" aria-hidden="true">1</span></div>
        <div class="step__body">
          <div class="step__head"><h2 id="loads-title" data-i18n="loads.title">Your loads</h2></div>
          <p class="step__lede" data-i18n="loads.lede"></p>
          <div class="toolbar">
            <button type="button" class="button" data-action="add-load" data-i18n="loads.add">Add a load</button>
            <button type="button" class="button" data-action="import-loads" data-i18n="loads.import">Import file</button>
            <a class="button" href="/api/load-table/template?format=xlsx" download data-i18n="loads.template">
              Download template
            </a>
            <button type="button" class="button" data-action="export-loads" data-i18n="loads.export">Export loads</button>
            <input type="file" accept=".csv,.xlsx" hidden data-loads-file />
          </div>
          <div class="notice" role="alert" hidden data-loads-alert></div>
          <div class="notice" role="status" hidden data-loads-issues></div>
          <div class="empty" data-loads-empty>
            <p data-i18n="loads.empty"></p>
            <button type="button" class="button button--primary" data-action="use-sample" data-i18n="loads.use_sample">
              Use the sample office
            </button>
          </div>
          <div class="table-scroll" hidden data-loads-scroll>
            <table class="loads" data-loads-table>
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="table-note" hidden data-loads-note data-i18n="loads.note"></p>
        </div>
      </section>

      <section class="step" id="day" aria-labelledby="day-title">
        <div class="step__marker"><span class="step__number" aria-hidden="true">2</span></div>
        <div class="step__body">
          <div class="step__head"><h2 id="day-title" data-i18n="day.title">Day and seasons</h2></div>
          <p class="step__lede" data-i18n="day.lede"></p>
        </div>
      </section>

      <section class="step" id="location" aria-labelledby="location-title">
        <div class="step__marker"><span class="step__number" aria-hidden="true">3</span></div>
        <div class="step__body">
          <div class="step__head"><h2 id="location-title" data-i18n="location.title">Location</h2></div>
          <p class="step__lede" data-i18n="location.lede"></p>
        </div>
      </section>

      <section class="step" id="results" aria-labelledby="results-title">
        <div class="step__marker"><span class="step__number" aria-hidden="true">4</span></div>
        <div class="step__body">
          <div class="step__head"><h2 id="results-title" data-i18n="results.title">Your consumption</h2></div>
          <p class="step__lede" data-i18n="results.lede"></p>
          <div class="empty" data-i18n="results.empty"></div>
        </div>
      </section>

      <section class="step" id="systems" aria-labelledby="systems-title">
        <div class="step__marker"><span class="step__number" aria-hidden="true">5</span></div>
        <div class="step__body">
          <div class="step__head"><h2 id="systems-title" data-i18n="systems.title">Solar systems</h2></div>
          <p class="step__lede" data-i18n="systems.lede"></p>
          <div class="empty" data-i18n="systems.empty"></div>
        </div>
      </section>
    </main>

    <section class="study-actions" data-i18n-attr="aria-label: actions.label">
      <div class="wrap">
        <button type="button" class="button button--primary" data-action="save" disabled data-i18n="actions.save">
          Save study
        </button>
        <button type="button" class="button" data-action="open" data-i18n="actions.open">Open study</button>
        <button type="button" class="button" data-action="report" disabled data-i18n="actions.report">
          Download Excel report
        </button>
        <button type="button" class="button" data-action="print" data-i18n="actions.print">Print</button>
      </div>
    </section>

    <footer class="site-footer">
      <div class="wrap">
        <p data-i18n="footer.data"></p>
        <p data-i18n="footer.disclaimer"></p>
      </div>
    </footer>
  </body>
</html>
