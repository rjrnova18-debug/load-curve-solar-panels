[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loadcurve"
version = "0.1.0"
description = "Estimate a site's electrical load profile and size on-grid, hybrid and off-grid solar PV systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx2>=2.16",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loadcurve = ["web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_legacy", "skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
